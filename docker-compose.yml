services:
  postgres:
    image: postgres:17
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: poop-together
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d poop-together"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
